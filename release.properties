completedPhase=check-poms
exec.activateProfiles=github
exec.pomFileName=pom.xml
exec.snapshotReleasePluginAllowed=false
pinExternals=false
preparationGoals=clean verify
project.scm.br.com.moreiracruz\:pipeline.connection=scm\:git\:git\://github.com/${git-user}/${git-repository}.git
project.scm.br.com.moreiracruz\:pipeline.developerConnection=scm\:git\:https\://github.com/${git-user}/${git-repository}.git
project.scm.br.com.moreiracruz\:pipeline.tag=pipeline-1.1.0
project.scm.br.com.moreiracruz\:pipeline.url=https\://github.com/${git-user}/${git-repository}
